# Per-key RGB: 21 SK6812MINI-E per half, wired as one WS2812 chain.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Light up at boot, solid red at moderate brightness. A chain that stays dark
# on power-up points at LED 1 or the data line, not at the firmware.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60

# Keep the strip lit for the whole test session.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# Rotary encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Enable only if an OLED is populated; an absent display slows boot.
# CONFIG_ZMK_DISPLAY=y

# Serial log over USB, for reading driver errors.
# CONFIG_ZMK_USB_LOGGING=y
