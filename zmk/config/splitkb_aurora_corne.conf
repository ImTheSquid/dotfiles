# Per-key RGB: 21 SK6812MINI-E per half, wired as one WS2812 chain.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Dark on the base layer: the layer macros light the strip and cut it again,
# and RGB_OFF drops the LED power rail with it.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60

# Keep the strip lit for the whole test session.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# Rotary encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse/scroll HID, for the right encoder's scroll wheel.
CONFIG_ZMK_POINTING=y

# Enable only if an OLED is populated; an absent display slows boot.
# CONFIG_ZMK_DISPLAY=y

# Serial log over USB, for reading driver errors.
# CONFIG_ZMK_USB_LOGGING=y
